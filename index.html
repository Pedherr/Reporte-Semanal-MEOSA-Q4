<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOSA 2026 | Centro de Mando Estratégico</title>
    
    <!-- Tailwind CSS (Motor de Estilos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuente Inter (Tipografía Ejecutiva) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        /* Animaciones sutiles */
        .animate-enter { animation: enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes enter { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Estilo de Tarjetas Elite */
        .card-elite {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease-in-out;
        }
        .card-elite:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="root"></div>

    <!-- Motor React (Sin JSX para máxima estabilidad) -->
    <script type="module">
        import React, { useState } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Iconos
        import { 
            Briefcase, Target, CheckCircle, Clock, Layout, Users, 
            Shield, Activity, Zap, Building2, BarChart3, 
            AlertTriangle, X, Menu, Calculator, Layers, XCircle,
            ClipboardList, GraduationCap, DollarSign
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- CONFIGURACIÓN ---
        const LAST_UPDATED = "31 de Enero, 2026"; 
        const HOURLY_RATE = 900; 

        // --- DATOS MAESTROS (SEMANAS 1-5) ---
        // Sem 1: 1h Ment (Var)
        // Sem 2: 6h Gram (Fijo), 9h Ment (Var)
        // Sem 3: 10h Gram (Fijo), 10h Var (4 Flex + 6 Ment)
        // Sem 4: 14h Gram (Fijo), 16h Var (7 Flex + 9 Ment)
        // Sem 5: 12h Gram (Fijo), 15h Var (5 Flex + 10 Ment)
        const financialHistory = [
            { week: 'Sem 01 (02-03 Ene)', gramosa: 0, flex: 0, ment: 1, activity: 'Inicio Año: Mentoría Edson.' },
            { week: 'Sem 02 (05-09 Ene)', gramosa: 6, flex: 0, ment: 9, activity: 'Gramosa (6h), Foco Planner.' },
            { week: 'Sem 03 (12-16 Ene)', gramosa: 10, flex: 4, ment: 6, activity: 'Gramosa(10), PFD(3), SK(1), Ment(6).' },
            { week: 'Sem 04 (19-23 Ene)', gramosa: 14, flex: 7, ment: 9, activity: 'Gramosa(14), SK(7), Ment(9).' },
            { week: 'Sem 05 (26-30 Ene)', gramosa: 12, flex: 5, ment: 10, activity: 'Gramosa(12), Flex(2SK+3PFD), Ment(10).' }
        ];

        const portfolioData = {
          strategic: [
            { id: 'pilgrims', client: 'PILGRIMS', title: 'Ingeniería BIM / Peletizado', status: 'PROP. ENVIADA', note: 'Enviada 26/01. Esperando feedback.', icon: Building2, color: 'emerald' },
            { id: 'altosano-med', client: 'ALTO SANO', title: 'Instalación Medidores Flujo', status: 'ENTREGADA', note: 'Entregada 30/01.', icon: CheckCircle, color: 'emerald' },
            { id: 'altosano-pan', client: 'ALTO SANO', title: 'Instalación de Paneles', status: 'EN PROCESO', note: 'Entrega programada 06/02.', icon: Zap, color: 'blue' },
            { id: 'sukarne', client: 'SuKarne', title: 'Soporte Universidad SK', status: 'VALIDANDO', note: 'Diagrama OK. Visita cierre 02/02.', icon: Users, color: 'blue' },
            { id: 'adm-planos', client: 'ADM', title: 'Levantamiento Planos', status: 'VIGENTE', note: 'Propuesta activa.', icon: Layout, color: 'blue' },
            { id: 'adm-tanques', client: 'ADM', title: 'Documentación Tanques', status: 'RECHAZADA', note: 'Archivar lecciones.', icon: XCircle, color: 'red' }
          ],
          approved: [
            { id: 'gramosa', client: 'GRAMOSA', title: 'Ingeniería Consultoría', status: 'En Ejecución', deadline: 'Feb 2026', note: 'Hito 154h superado (60% Total).', icon: CheckCircle, progress: 60, totalHH: '154 / 256 HH' }
          ],
          recurring: [
            { id: 'poliza', client: 'SuKarne', title: 'Póliza Mantenimiento', status: 'Activo', note: 'Sesión 2h (Planificación).', icon: Shield },
            { id: 'pfd', client: 'MEOSA', title: 'Proyecto PFD', status: 'En Curso', note: 'Sesión 3h (Retomado).', icon: Activity },
            { id: 'mentoria', client: 'MEOSA', title: 'Mentorías Internas', status: 'Continuo', note: '10h esta semana (Germán 8h).', icon: Users }
          ]
        };

        const modelsData = [
            { type: 'Proyecto Cerrado', desc: 'Entregables + Hitos (Fijo)', color: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50', icon: CheckCircle, items: [{ label: 'GRAMOSA', value: 'Avance: 154 HH (60%)' }] },
            { type: 'Gestión Cotizaciones', desc: 'Pipeline Comercial', color: 'bg-blue-500', text: 'text-blue-700', bg: 'bg-blue-50', icon: ClipboardList, items: [{ label: "Pilgrim's", status: 'ENVIADA' }, { label: 'Alto Sano (Med)', status: 'ENTREGADA' }, { label: 'Alto Sano (Pan)', status: '06/02' }] },
            { type: 'HH Consumidas', desc: 'Póliza / Soporte (Variable)', color: 'bg-amber-500', text: 'text-amber-700', bg: 'bg-amber-50', icon: Shield, items: [{ label: 'SuKarne Póliza', value: '12 HH (YTD)' }, { label: 'PFD', value: '6 HH (YTD)' }, { label: 'Total Variable', value: '18 HH Enero' }] },
            { type: 'Mentorías', desc: 'Desarrollo Roles (Variable)', color: 'bg-indigo-500', text: 'text-indigo-700', bg: 'bg-indigo-50', icon: GraduationCap, items: [{ label: 'Planner', value: '28h' }, { label: 'Coord', value: '4h' }, { label: 'Ops', value: '3h' }] }
        ];

        const alignmentPoints = [
            { title: 'Cierre Comercial Enero', text: 'Objetivos cumplidos: Pilgrim\'s enviado (26/01) y Alto Sano Medidores entregado (30/01). Paneles queda para Sem 1 Feb.' },
            { title: 'Hito Gramosa', text: 'Se rompe la barrera de las 150 horas (154h acumuladas). Avance físico y financiero alineado al 60%.' },
            { title: 'Validación SuKarne', text: 'Diagrama de flujo Rolado Michoacán entregado. Todo listo para visita de cierre el 02/02.' },
            { title: 'Recursos Internos', text: 'Semana más fuerte en capacitación (10h). Germán Planner consolidado con 8h esta semana. PFD reactivado.' }
        ];

        // --- UTILS ---
        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
        const ce = React.createElement; // Alias para escribir menos

        // --- COMPONENTES UI ---

        const Card = ({ children, className = "" }) => 
            ce('div', { className: `card-elite p-6 ${className}` }, children);

        const Badge = ({ children, color = "blue" }) => {
            const colors = {
                blue: "bg-blue-100 text-blue-800 border-blue-200",
                emerald: "bg-emerald-100 text-emerald-800 border-emerald-200",
                amber: "bg-amber-100 text-amber-800 border-amber-200",
                red: "bg-red-100 text-red-800 border-red-200",
                cyan: "bg-cyan-100 text-cyan-800 border-cyan-200",
                purple: "bg-purple-100 text-purple-800 border-purple-200",
            };
            return ce('span', { className: `px-2.5 py-0.5 rounded text-[10px] font-bold border uppercase tracking-wide ${colors[color] || colors.blue}` }, children);
        };

        const ProgressBar = ({ progress, label, color = "emerald" }) => 
            ce('div', { className: "w-full mt-4" },
                ce('div', { className: "flex justify-between text-xs mb-1 font-semibold text-slate-600" },
                    ce('span', null, "Avance HH"),
                    ce('span', { className: "text-slate-900 font-mono" }, label)
                ),
                ce('div', { className: "w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200" },
                    ce('div', { 
                        className: `h-full rounded-full transition-all duration-1000 ${color === 'emerald' ? 'bg-emerald-500' : 'bg-blue-500'}`, 
                        style: { width: `${progress}%` } 
                    })
                )
            );

        const SectionHeader = ({ title, subtitle, icon }) => 
            ce('div', { className: "mb-8 flex items-center gap-4 border-b border-slate-200 pb-4" },
                ce('div', { className: "p-3 bg-white border border-slate-200 rounded-xl text-slate-800 shadow-sm" },
                    ce(icon, { size: 24 })
                ),
                ce('div', null,
                    ce('h2', { className: "text-2xl font-bold text-slate-900 leading-none" }, title),
                    ce('p', { className: "text-slate-500 text-sm mt-1" }, subtitle)
                )
            );

        // --- VISTAS ---

        const ViewFinancials = () => {
            const totals = financialHistory.reduce((acc, row) => ({
                gramosa: acc.gramosa + row.gramosa,
                flex: acc.flex + row.flex,
                ment: acc.ment + row.ment,
                total: acc.total + row.gramosa + row.flex + row.ment
            }), { gramosa: 0, flex: 0, ment: 0, total: 0 });

            const totalBillable = totals.flex + totals.ment;
            const totalCost = totalBillable * HOURLY_RATE;
            
            // Distribution Calc
            const pctFixed = (totals.gramosa / totals.total) * 100;
            const pctVar = (totalBillable / totals.total) * 100;

            return ce('div', { className: "space-y-8 animate-enter" },
                ce(SectionHeader, { title: "Control Financiero", subtitle: "Rentabilidad y Carga Operativa (Cierre Enero)", icon: Calculator }),
                
                // Tarjetas KPI
                ce('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" },
                    ce(Card, { className: "border-t-4 border-t-slate-500" },
                        ce('div', { className: "flex justify-between items-start" },
                            ce('div', null,
                                ce('p', { className: "text-xs text-slate-500 font-bold uppercase tracking-wider" }, "Ocupación Total"),
                                ce('p', { className: "text-3xl font-black text-slate-800 mt-1" }, `${totals.total} h`)
                            ),
                            ce(Clock, { className: "text-slate-300", size: 24 })
                        )
                    ),
                    ce(Card, { className: "border-t-4 border-t-purple-500" },
                        ce('div', { className: "flex justify-between items-start" },
                            ce('div', null,
                                ce('p', { className: "text-xs text-purple-600 font-bold uppercase tracking-wider" }, "Fijo (Gramosa)"),
                                ce('p', { className: "text-3xl font-black text-purple-900 mt-1" }, `${totals.gramosa} h`)
                            ),
                            ce(Briefcase, { className: "text-purple-300", size: 24 })
                        )
                    ),
                    ce(Card, { className: "border-t-4 border-t-blue-600" },
                        ce('div', { className: "flex justify-between items-start" },
                            ce('div', null,
                                ce('p', { className: "text-xs text-blue-600 font-bold uppercase tracking-wider" }, "Costeables"),
                                ce('p', { className: "text-3xl font-black text-blue-900 mt-1" }, `${totalBillable} h`)
                            ),
                            ce(Target, { className: "text-blue-300", size: 24 })
                        )
                    ),
                    ce(Card, { className: "border-t-4 border-t-emerald-600 bg-emerald-50/30" },
                        ce('div', { className: "flex justify-between items-start" },
                            ce('div', null,
                                ce('p', { className: "text-xs text-emerald-700 font-bold uppercase tracking-wider" }, "Inversión Ene"),
                                ce('p', { className: "text-3xl font-black text-emerald-800 mt-1 tracking-tight" }, formatMoney(totalCost))
                            ),
                            ce(DollarSign, { className: "text-emerald-500", size: 24 })
                        )
                    ),
                ),

                // Distribution Bar
                ce('div', { className: "bg-white p-4 rounded-xl border border-slate-200 shadow-sm" },
                    ce('h4', { className: "text-xs font-bold text-slate-600 uppercase mb-3 flex items-center gap-2" },
                        ce(Activity, { size: 14 }), " Distribución de Esfuerzo Mensual"
                    ),
                    ce('div', { className: "flex h-4 w-full rounded-full overflow-hidden mb-2" },
                        ce('div', { className: "bg-purple-500", style: { width: `${pctFixed}%` } }),
                        ce('div', { className: "bg-blue-500", style: { width: `${pctVar}%` } })
                    ),
                    ce('div', { className: "flex justify-between text-xs font-medium text-slate-500" },
                        ce('span', { className: "flex items-center gap-1" }, 
                            ce('span', { className: "w-2 h-2 rounded-full bg-purple-500" }), `Paquete Fijo (${Math.round(pctFixed)}%)`
                        ),
                        ce('span', { className: "flex items-center gap-1" }, 
                            ce('span', { className: "w-2 h-2 rounded-full bg-blue-500" }), `Tiempo Variable (${Math.round(pctVar)}%)`
                        )
                    )
                ),

                // Super Table
                ce('div', { className: "border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white" },
                    ce('table', { className: "w-full text-sm text-left border-collapse" },
                        ce('thead', { className: "bg-slate-50 text-slate-700 font-bold uppercase text-xs border-b border-slate-200" },
                            ce('tr', null,
                                ce('th', { className: "px-6 py-4 border-r border-slate-100" }, "Semana"),
                                ce('th', { className: "px-6 py-4 w-1/3 border-r border-slate-100" }, "Actividad Clave"),
                                ce('th', { className: "px-4 py-4 text-center bg-slate-100/50 border-r border-slate-100" }, "Total"),
                                ce('th', { className: "px-4 py-4 text-center text-purple-700 bg-purple-50/30 border-r border-purple-100" }, "Fijo"),
                                ce('th', { className: "px-4 py-4 text-center text-blue-700 bg-blue-50/30 border-r border-blue-100" }, "Flex"),
                                ce('th', { className: "px-4 py-4 text-center text-indigo-700 bg-indigo-50/30 border-r border-indigo-100" }, "Ment"),
                                ce('th', { className: "px-6 py-4 text-right text-emerald-800 bg-emerald-50/30 border-r border-emerald-100" }, "Costo Sem."),
                                ce('th', { className: "px-6 py-4 text-right bg-emerald-50 text-emerald-900" }, "Costo Acum.")
                            )
                        ),
                        ce('tbody', { className: "divide-y divide-slate-100" },
                            financialHistory.map((row, i) => {
                                const periodBillable = row.flex + row.ment;
                                const weeklyCost = periodBillable * HOURLY_RATE;
                                const accBillable = financialHistory.slice(0, i+1).reduce((a,c) => a + c.flex + c.ment, 0);
                                const accCost = accBillable * HOURLY_RATE;
                                const totalRow = row.gramosa + row.flex + row.ment;
                                
                                return ce('tr', { key: i, className: "hover:bg-slate-50 transition-colors group" },
                                    ce('td', { className: "px-6 py-4 font-medium text-slate-700 border-r border-slate-100" }, row.week),
                                    ce('td', { className: "px-6 py-4 text-slate-600 text-xs max-w-xs border-r border-slate-100" }, row.activity),
                                    ce('td', { className: "px-4 py-4 text-center font-bold text-slate-900 border-r border-slate-100 bg-slate-50/30" }, `${totalRow} h`),
                                    ce('td', { className: "px-4 py-4 text-center text-purple-700 font-medium bg-purple-50/10 border-r border-purple-50 group-hover:bg-purple-50/30" }, row.gramosa || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-blue-700 font-medium bg-blue-50/10 border-r border-blue-50 group-hover:bg-blue-50/30" }, row.flex || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-indigo-700 font-medium bg-indigo-50/10 border-r border-indigo-50 group-hover:bg-indigo-50/30" }, row.ment || '-'),
                                    ce('td', { className: "px-6 py-4 text-right text-slate-600 font-mono bg-emerald-50/10 border-r border-emerald-50 group-hover:bg-emerald-50/20" }, formatMoney(weeklyCost)),
                                    ce('td', { className: "px-6 py-4 text-right font-bold text-emerald-800 font-mono bg-emerald-50 group-hover:bg-emerald-100/50" }, formatMoney(accCost))
                                );
                            })
                        ),
                        ce('tfoot', { className: "bg-slate-50 font-bold border-t-2 border-slate-200 text-xs uppercase" },
                            ce('tr', null,
                                ce('td', { colSpan: 2, className: "px-6 py-4 text-right text-slate-500 tracking-wider" }, "TOTALES ENERO"),
                                ce('td', { className: "px-4 py-4 text-center bg-slate-100 text-slate-900" }, `${totals.total} h`),
                                ce('td', { className: "px-4 py-4 text-center text-purple-900 bg-purple-50" }, `${totals.gramosa} h`),
                                ce('td', { className: "px-4 py-4 text-center text-blue-900 bg-blue-50" }, `${totals.flex} h`),
                                ce('td', { className: "px-4 py-4 text-center text-indigo-900 bg-indigo-50" }, `${totals.ment} h`),
                                ce('td', { className: "px-6 py-4 text-right bg-emerald-50/50 text-slate-400" }, "-"),
                                ce('td', { className: "px-6 py-4 text-right bg-emerald-100 text-emerald-900 text-sm border-l-4 border-l-emerald-400" }, formatMoney(totalCost))
                            )
                        )
                    )
                ),

                ce('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-start gap-3 text-sm text-blue-800" },
                    ce(Layers, { className: "mt-0.5 text-blue-500", size: 18 }),
                    ce('div', null,
                        ce('h4', { className: "font-bold text-blue-900" }, "Regla de Inversión"),
                        ce('p', { className: "text-blue-700 mt-1" }, 
                            "Costo Variable = (Pack Flexible: PFD/SuKarne + Mentorías) x Tarifa. Las horas Fijas (GRAMOSA) no impactan este monto."
                        )
                    )
                )
            );
        };

        const ViewPortfolio = () => {
            return ce('div', { className: "space-y-8 animate-enter" },
                ce(SectionHeader, { title: "Portafolio de Cuentas", subtitle: "Estatus de Frentes Activos", icon: Briefcase }),
                
                // Estratégicos
                ce('div', null,
                    ce('h3', { className: "text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4" },
                        ce(Target, { className: "text-blue-600", size: 20 }), " Frentes Estratégicos & Oportunidades"
                    ),
                    ce('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-4" },
                        portfolioData.strategic.map((p, i) => 
                            ce('div', { key: i, className: `card-elite p-5 border-l-4 ${p.color === 'red' ? 'border-l-red-500' : p.color === 'cyan' ? 'border-l-cyan-500' : p.color === 'emerald' ? 'border-l-emerald-500' : 'border-l-blue-500'}` },
                                ce('div', { className: "flex justify-between items-start mb-3 pl-2" },
                                    ce('div', { className: "flex items-center gap-2" },
                                        ce(p.icon, { size: 20, className: "text-slate-400" }),
                                        ce('span', { className: "text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600 border border-slate-200" }, p.client)
                                    ),
                                    ce(Badge, { color: p.color }, p.status)
                                ),
                                ce('h4', { className: "font-bold text-slate-800 pl-2 text-lg mb-1" }, p.title),
                                ce('p', { className: "text-sm text-slate-500 pl-2" }, p.note)
                            )
                        )
                    )
                ),

                // Ejecución
                ce('div', null,
                    ce('h3', { className: "text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4" },
                        ce(CheckCircle, { className: "text-emerald-600", size: 20 }), " En Ejecución & Recurrentes"
                    ),
                    ce('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
                        ce(Card, { className: "border-l-4 border-l-emerald-500" },
                            ce('div', { className: "flex justify-between items-start" },
                                ce('div', { className: "flex items-center gap-3" },
                                    ce('div', { className: "p-3 bg-emerald-100 rounded-xl text-emerald-700" }, ce(CheckCircle, { size: 24 })),
                                    ce('div', null,
                                        ce('h4', { className: "font-bold text-slate-800 text-lg" }, "GRAMOSA Ing."),
                                        ce('p', { className: "text-xs text-slate-500" }, "Consultoría Activa")
                                    )
                                ),
                                ce(Badge, { color: "emerald" }, "EN EJECUCIÓN")
                            ),
                            ce(ProgressBar, { progress: 60, label: "154 / 256 HH" })
                        ),

                        ce('div', { className: "grid gap-3" },
                            [
                                { title: "SuKarne Póliza", sub: "Gestión Michoacán", val: "12 HH Ene", icon: Shield, color: "text-amber-600", bg: "bg-amber-100" },
                                { title: "Mentorías PH", sub: "Planner/Coord/Ops", val: "35 HH Ene", icon: Users, color: "text-indigo-600", bg: "bg-indigo-100" },
                                { title: "Proyecto PFD", sub: "En Curso", val: "6 HH Ene", icon: Activity, color: "text-purple-600", bg: "bg-purple-100" }
                            ].map((k, i) => 
                                ce('div', { key: i, className: "bg-white p-4 border border-slate-200 rounded-xl flex justify-between items-center shadow-sm hover:border-slate-300 transition-colors" },
                                    ce('div', { className: "flex items-center gap-3" },
                                        ce('div', { className: `p-2 rounded-lg ${k.bg} ${k.color}` }, ce(k.icon, { size: 18 })),
                                        ce('div', null,
                                            ce('p', { className: "font-bold text-xs text-slate-800" }, k.title),
                                            ce('p', { className: "text-[10px] text-slate-500 uppercase" }, k.sub)
                                        )
                                    ),
                                    ce('span', { className: "font-mono text-xs font-bold text-slate-700 bg-slate-50 px-3 py-1 rounded border border-slate-100" }, k.val)
                                )
                            )
                        )
                    )
                )
            );
        };

        const ViewModels = () => ce('div', { className: "space-y-6 animate-enter" },
            ce(SectionHeader, { title: "Modelos de Gestión", subtitle: "Actividad detallada por esquema", icon: Layout }),
            ce('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                modelsData.map((m, idx) => 
                    ce(Card, { key: idx, className: "hover:border-blue-300 transition-colors" },
                        ce('div', { className: "flex items-start justify-between mb-4" },
                            ce('div', null,
                                ce('div', { className: `h-1.5 w-12 ${m.color} rounded-full mb-2` }),
                                ce('h4', { className: "font-bold text-xl text-slate-800" }, m.type),
                                ce('p', { className: "text-xs text-slate-500 uppercase tracking-wide font-semibold" }, m.desc)
                            ),
                            ce('div', { className: `p-2 rounded-lg ${m.bg} ${m.text}` },
                                ce(m.icon, { size: 24 })
                            )
                        ),
