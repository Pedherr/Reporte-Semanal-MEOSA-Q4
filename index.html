<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOSA 2026 | Centro de Mando Estratégico</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel (Motor Robusto UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .animate-enter { animation: enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes enter { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .card-elite {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease-in-out;
        }
        .card-elite:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }

        .timeline-line::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: #e2e8f0;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONOS GLOBALES ---
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]); 
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- CONFIGURACIÓN ---
        const LAST_UPDATED = "14 de Marzo, 2026"; 
        const HOURLY_RATE = 900; 

        // --- DATOS MAESTROS ---
        const financialHistory = [
            // Enero (Cerrado)
            { week: 'Sem 01 (02-03 Ene)', gramosa: 0, flex: 0, ment: 1, activity: 'Inicio Año: Mentoría Edson.', status: 'Cerrado' },
            { week: 'Sem 02 (05-09 Ene)', gramosa: 6, flex: 0, ment: 9, activity: 'Gramosa (6h), Foco Planner.', status: 'Cerrado' },
            { week: 'Sem 03 (12-16 Ene)', gramosa: 10, flex: 4, ment: 6, activity: 'Gramosa(10), PFD(3), SK(1), Ment(6).', status: 'Cerrado' },
            { week: 'Sem 04 (19-23 Ene)', gramosa: 14, flex: 7, ment: 9, activity: 'Gramosa(14), SK(7), Ment(9).', status: 'Cerrado' },
            { week: 'Sem 05 (26-30 Ene)', gramosa: 12, flex: 5, ment: 10, activity: 'Gramosa(12), Flex(5), Ment(10).', status: 'Cerrado' },
            
            // Febrero (Cerrado)
            { week: 'Sem 06 (02-06 Feb)', gramosa: 6, flex: 11, ment: 7, activity: 'USK Lev.(6), SK Pol.(5), Gram(6), Ment(7).', status: 'Cerrado' },
            { week: 'Sem 07 (09-13 Feb)', gramosa: 10, flex: 9, ment: 9, activity: 'Gram(10) Elec/Auto, SK(9) GPT ISO, Ment(9).', status: 'Cerrado' },
            { week: 'Sem 08 (16-20 Feb)', gramosa: 14, flex: 21, ment: 6, activity: 'Gram(14), AltoSano(13+), SK/Ment.', status: 'Cerrado' },
            { week: 'Sem 09 (23-27 Feb)', gramosa: 10, flex: 24, ment: 6, activity: 'Gram(10), ADM Volt(13), SK(11 inc Sab).', status: 'Cerrado' },

            // Marzo (En Curso)
            { week: 'Sem 10 (02-06 Mar)', gramosa: 7, flex: 24, ment: 7, activity: 'SK(22 incl. Viaje L5 + Contin. Dgo), Ment(7), Gram(7), ADM(2).', status: 'Cerrado' },
            { week: 'Sem 11 (09-13 Mar)', gramosa: 12, flex: 32, ment: 4, activity: 'Gram(12), PFD/L5/SK(32), Ment(4).', status: 'Cierre Sem' }
        ];

        const portfolioData = {
          strategic: [
            { id: 'altosano-med', client: 'ALTO SANO', title: 'Instalación Medidores Flujo', status: 'ENTREGADA', note: 'Propuesta enviada 30/01.', icon: 'check-circle', color: 'emerald' },
            { id: 'altosano-pan', client: 'ALTO SANO', title: 'Instalación de Paneles', status: 'EN ESPERA', note: 'Aún sin respuesta del cliente.', icon: 'clock', color: 'amber' },
            { id: 'sukarne', client: 'SuKarne', title: 'Soporte Universidad SK', status: 'COTIZANDO L5', note: 'Info compartida con equipo de cotización.', icon: 'file-text', color: 'blue' },
            { id: 'adm-planos', client: 'ADM', title: 'Levantamiento Planos', status: 'VIGENTE', note: 'Propuesta activa.', icon: 'layout', color: 'blue' },
            { id: 'adm-volteador', client: 'ADM', title: 'Volteador Celaya', status: 'COTIZANDO', note: 'Info lista y PFD divulgado al equipo.', icon: 'file-text', color: 'blue' }
          ],
          approved: [
            { id: 'gramosa', client: 'GRAMOSA', title: 'Ingeniería Consultoría', status: 'En Ejecución', deadline: 'Feb 2026', note: 'Avance sólido 83% (213 HH). Recta Final.', icon: 'check-circle', progress: 83, totalHH: '213 / 256 HH' }
          ],
          recurring: [
            { id: 'poliza', client: 'SuKarne', title: 'Póliza Mantenimiento', status: 'Atención DGO', note: 'Reporte seguridad/elevador Dgo en proceso de envío.', icon: 'shield' },
            { id: 'pfd', client: 'MEOSA', title: 'Proyecto PFD', status: 'Activo', note: 'Primer ejercicio de PFD divulgado al equipo.', icon: 'activity' },
            { id: 'mentoria', client: 'MEOSA', title: 'Mentorías Internas', status: 'En Curso', note: '4h (Foco exclusivo Planner).', icon: 'users' }
          ]
        };

        const modelsData = [
            { type: 'Proyecto Cerrado', desc: 'Entregables + Hitos (Fijo)', color: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50', icon: 'check-circle', items: [{ label: 'GRAMOSA', value: 'Avance: 213 HH (83%)' }] },
            { type: 'Gestión Cotizaciones', desc: 'Pipeline Comercial', color: 'bg-blue-500', text: 'text-blue-700', bg: 'bg-blue-50', icon: 'clipboard-list', items: [{ label: "USK (Línea 5)", status: 'COTIZANDO' }, { label: 'ADM Volteador', status: 'COTIZANDO' }, { label: "Alto Sano (Pan)", status: 'EN ESPERA' }] },
            { type: 'HH Consumidas', desc: 'Póliza / Soporte (Variable)', color: 'bg-amber-500', text: 'text-amber-700', bg: 'bg-amber-50', icon: 'shield', items: [{ label: 'Marzo (Sem 10-11)', value: '56 HH Flexibles' }, { label: 'PFD + L5', value: 'Estructuración completada' }, { label: 'SuKarne Póliza', value: 'Foco en Reportes Dgo' }] },
            { type: 'Mentorías', desc: 'Desarrollo Roles (Variable)', color: 'bg-indigo-500', text: 'text-indigo-700', bg: 'bg-indigo-50', icon: 'graduation-cap', items: [{ label: 'Marzo (Sem 10-11)', value: '11 HH Mentoría' }, { label: 'Total YTD 2026', value: '74 HH Mentoría' }, { label: 'Foco', value: 'Planner exclusivo' }] }
        ];

        const alignmentPoints = [
            { title: 'Avance de Cotizaciones', text: 'Excelente desbloqueo: La información del Levantamiento L5 (USK) y ADM Volteador ya fue procesada y compartida con el equipo de cotizaciones.' },
            { title: 'Contingencia Durango', text: 'Se invirtieron horas de Póliza en elaborar el reporte de seguridad por accidente y daño del elevador. Pendiente su envío formal al cliente.' },
            { title: 'Consolidación Gramosa', text: 'Se sumaron 12 HH en la semana, alcanzando el 83% de avance. Entramos en la fase de cierre de proyecto.' },
            { title: 'Desarrollo Interno', text: 'La mentoría se enfocó exclusivamente en el Planner (Germán) y se logró la divulgación del primer ejercicio PFD al equipo operativo.' }
        ];

        // --- UTILS ---
        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

        // --- COMPONENTES UI ---

        const Card = ({ children, className = '' }) => (
            <div className={`card-elite p-6 ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = 'blue' }) => {
            const colors = {
                blue: 'bg-blue-50 text-blue-700 border-blue-200', 
                emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                amber: 'bg-amber-50 text-amber-700 border-amber-200', 
                red: 'bg-red-50 text-red-700 border-red-200',
                cyan: 'bg-cyan-50 text-cyan-700 border-cyan-200',
                purple: 'bg-purple-50 text-purple-700 border-purple-200',
                slate: 'bg-slate-100 text-slate-700 border-slate-300' 
            };
            return (
                <span className={`px-2.5 py-0.5 rounded-md text-[10px] font-bold border uppercase tracking-wider ${colors[color] || colors.blue}`}>
                    {children}
                </span>
            );
        };

        const ProgressBar = ({ progress, label, color = "emerald" }) => (
            <div className="w-full mt-4">
                <div className="flex justify-between text-xs mb-1.5 font-semibold text-slate-600">
                    <span>Avance HH</span>
                    <span className="text-slate-900 font-mono">{label}</span>
                </div>
                <div className="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200 shadow-inner">
                    <div className={`h-full rounded-full transition-all duration-1000 shadow-sm ${color === 'emerald' ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${progress}%` }}></div>
                </div>
            </div>
        );

        const SectionHeader = ({ title, subtitle, icon }) => (
            <div className="mb-8 flex items-center gap-4 border-b border-slate-200 pb-4">
                <div className="p-3 bg-white border border-slate-200 rounded-xl text-slate-800 shadow-sm">
                    <Icon name={icon} size={24} />
                </div>
                <div>
                    <h2 className="text-2xl font-bold text-slate-900 leading-none">{title}</h2>
                    <p className="text-slate-500 text-sm mt-1">{subtitle}</p>
                </div>
            </div>
        );

        // --- VISTAS ---

        const ViewFinancials = () => {
            const calculateTotals = (data) => data.reduce((acc, row) => ({
                gramosa: acc.gramosa + row.gramosa,
                flex: acc.flex + row.flex,
                ment: acc.ment + row.ment,
                total: acc.total + row.gramosa + row.flex + row.ment
            }), { gramosa: 0, flex: 0, ment: 0, total: 0 });

            // Enero (Sem 1-5)
            const rowsJan = financialHistory.slice(0, 5);
            const totalsJan = calculateTotals(rowsJan);
            const costJan = (totalsJan.flex + totalsJan.ment) * HOURLY_RATE;

            // Febrero (Sem 6-9)
            const rowsFeb = financialHistory.slice(5, 9);
            const totalsFeb = calculateTotals(rowsFeb);
            const costFeb = (totalsFeb.flex + totalsFeb.ment) * HOURLY_RATE;

            // Marzo (Sem 10+)
            const rowsMar = financialHistory.slice(9);
            const totalsMar = calculateTotals(rowsMar);
            const costMar = (totalsMar.flex + totalsMar.ment) * HOURLY_RATE;

            // Grand Total
            const grandTotalHours = totalsJan.total + totalsFeb.total + totalsMar.total;
            const grandTotalCost = costJan + costFeb + costMar;

            return (
                <div className="space-y-8 animate-enter">
                    <SectionHeader title="Control Financiero" subtitle="Estado de Resultados Operativo (Corte 14 Marzo)" icon="calculator" />
                    
                    {/* Summary Cards */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-slate-800 rounded-xl p-6 text-white shadow-xl flex justify-between items-center">
                            <div>
                                <p className="text-slate-400 text-xs font-bold uppercase tracking-wider mb-1">Cierre Febrero</p>
                                <h3 className="text-3xl font-black">{formatMoney(costFeb)}</h3>
                                <div className="flex gap-3 mt-2 text-xs text-slate-300">
                                    <span>Total: <strong>{totalsFeb.total}h</strong></span>
                                    <span>•</span>
                                    <span>Var: <strong>{totalsFeb.flex + totalsFeb.ment}h</strong></span>
                                    <span>•</span>
                                    <span>Fijo: <strong>{totalsFeb.gramosa}h</strong></span>
                                </div>
                            </div>
                            <div className="p-3 bg-white/10 rounded-lg"><Icon name="check-circle" size={32} /></div>
                        </div>

                        <div className="bg-white border border-emerald-200 rounded-xl p-6 shadow-md flex justify-between items-center">
                            <div>
                                <p className="text-emerald-600 text-xs font-bold uppercase tracking-wider mb-1">Marzo (Sem 10-11)</p>
                                <h3 className="text-3xl font-black text-slate-800">{formatMoney(costMar)}</h3>
                                <div className="flex gap-3 mt-2 text-xs text-slate-500">
                                    <span>Total: <strong>{totalsMar.total}h</strong></span>
                                    <span>•</span>
                                    <span>Var: <strong>{totalsMar.flex + totalsMar.ment}h</strong></span>
                                    <span>•</span>
                                    <span>Fijo: <strong>{totalsMar.gramosa}h</strong></span>
                                </div>
                            </div>
                            <div className="p-3 bg-emerald-50 rounded-lg text-emerald-600"><Icon name="activity" size={32} /></div>
                        </div>
                    </div>

                    {/* Consolidated Table */}
                    <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                        <table className="w-full text-sm text-left border-collapse">
                            <thead className="bg-slate-50 text-slate-700 font-bold uppercase text-xs border-b border-slate-200">
                                <tr>
                                    <th className="px-6 py-4 border-r border-slate-100">Periodo</th>
                                    <th className="px-6 py-4 w-1/3 border-r border-slate-100">Actividad Clave</th>
                                    <th className="px-4 py-4 text-center bg-slate-100/50 border-r border-slate-100">Total</th>
                                    <th className="px-4 py-4 text-center text-purple-700 bg-purple-50/30 border-r border-purple-100">Fijo</th>
                                    <th className="px-4 py-4 text-center text-blue-700 bg-blue-50/30 border-r border-blue-100">Flex</th>
                                    <th className="px-4 py-4 text-center text-indigo-700 bg-indigo-50/30 border-r border-indigo-100">Ment</th>
                                    <th className="px-6 py-4 text-right bg-emerald-50 text-emerald-900">Inversión Var.</th>
                                </tr>
                            </thead>
                            
                            {/* Enero Group */}
                            <tbody className="divide-y divide-slate-100 border-b-2 border-slate-200 opacity-60 hover:opacity-100 transition-opacity">
                                <tr className="bg-slate-50/50"><td colSpan="7" className="px-6 py-2 text-xs font-bold text-slate-500 uppercase tracking-widest">Enero 2026 (Cerrado)</td></tr>
                                <tr className="bg-slate-100 font-bold text-slate-800">
                                    <td colSpan="2" className="px-6 py-3 text-right text-xs uppercase tracking-wide">Subtotal Enero</td>
                                    <td className="px-4 py-3 text-center bg-slate-200">{totalsJan.total} h</td>
                                    <td className="px-4 py-3 text-center text-purple-900">{totalsJan.gramosa} h</td>
                                    <td className="px-4 py-3 text-center text-blue-900">{totalsJan.flex} h</td>
                                    <td className="px-4 py-3 text-center text-indigo-900">{totalsJan.ment} h</td>
                                    <td className="px-6 py-3 text-right text-emerald-800">{formatMoney(costJan)}</td>
                                </tr>
                            </tbody>

                            {/* Febrero Group */}
                            <tbody className="divide-y divide-slate-100 border-b-2 border-slate-200 opacity-80 hover:opacity-100 transition-opacity">
                                <tr className="bg-slate-50/50"><td colSpan="7" className="px-6 py-2 text-xs font-bold text-slate-500 uppercase tracking-widest">Febrero 2026 (Cerrado)</td></tr>
                                <tr className="bg-slate-100 font-bold text-slate-800">
                                    <td colSpan="2" className="px-6 py-3 text-right text-xs uppercase tracking-wide">Subtotal Febrero</td>
                                    <td className="px-4 py-3 text-center bg-slate-200">{totalsFeb.total} h</td>
                                    <td className="px-4 py-3 text-center text-purple-900">{totalsFeb.gramosa} h</td>
                                    <td className="px-4 py-3 text-center text-blue-900">{totalsFeb.flex} h</td>
                                    <td className="px-4 py-3 text-center text-indigo-900">{totalsFeb.ment} h</td>
                                    <td className="px-6 py-3 text-right text-emerald-800">{formatMoney(costFeb)}</td>
                                </tr>
                            </tbody>

                            {/* Marzo Group */}
                            <tbody className="divide-y divide-slate-100">
                                <tr className="bg-slate-50/50"><td colSpan="7" className="px-6 py-2 text-xs font-bold text-slate-500 uppercase tracking-widest text-emerald-700">Marzo 2026</td></tr>
                                {rowsMar.map((row, i) => {
                                    const weeklyCost = (row.flex + row.ment) * HOURLY_RATE;
                                    return (
                                        <tr key={`mar-${i}`} className="hover:bg-slate-50 transition-colors group bg-emerald-50/10">
                                            <td className="px-6 py-4 font-medium text-slate-800 border-r border-slate-100">{row.week}</td>
                                            <td className="px-6 py-4 text-slate-700 text-xs max-w-xs border-r border-slate-100">{row.activity}</td>
                                            <td className="px-4 py-4 text-center font-black text-slate-900 border-r border-slate-100 bg-slate-50/50">{row.gramosa + row.flex + row.ment} h</td>
                                            <td className="px-4 py-4 text-center text-purple-700 font-medium border-r border-slate-100">{row.gramosa || '-'}</td>
                                            <td className="px-4 py-4 text-center text-blue-700 font-medium border-r border-slate-100">{row.flex || '-'}</td>
                                            <td className="px-4 py-4 text-center text-indigo-700 font-medium border-r border-slate-100">{row.ment || '-'}</td>
                                            <td className="px-6 py-4 text-right text-emerald-800 font-mono font-bold">{formatMoney(weeklyCost)}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>

                    {/* Acumulado General */}
                    <div className="flex justify-end mt-4">
                        <div className="text-right bg-slate-800 text-white p-4 rounded-lg shadow-lg">
                            <p className="text-xs font-bold uppercase tracking-widest mb-1 text-slate-400">Inversión Variable YTD</p>
                            <div className="flex items-baseline justify-end gap-2">
                                <p className="text-2xl font-black">{formatMoney(grandTotalCost)}</p>
                                <span className="text-sm font-medium text-slate-400">/ {totalsJan.flex+totalsJan.ment+totalsFeb.flex+totalsFeb.ment+totalsMar.flex+totalsMar.ment} HH</span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-start gap-3 text-sm text-blue-800">
                        <Icon name="layers" className="mt-0.5 text-blue-500" size={18} />
                        <div>
                            <h4 className="font-bold text-blue-900">Regla de Inversión</h4>
                            <p className="text-blue-700 mt-1">
                                Costo Variable = (Pack Flexible: PFD/SuKarne/AltoSano + Mentorías) x Tarifa. Las horas Fijas (GRAMOSA) no impactan este monto.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const ViewPortfolio = () => {
            return (
                <div className="space-y-8 animate-enter">
                    <SectionHeader title="Portafolio de Cuentas" subtitle="Estatus de Frentes Activos" icon="briefcase" />
                    
                    {/* Estratégicos */}
                    <div>
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4">
                            <Icon name="target" className="text-blue-600" size={20} /> Frentes Estratégicos & Oportunidades
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {portfolioData.strategic.map((p, i) => (
                                <Card key={i} className={`p-5 border-l-4 ${p.color === 'red' ? 'border-l-red-500' : p.color === 'cyan' ? 'border-l-cyan-500' : p.color === 'amber' ? 'border-l-amber-500' : p.color === 'purple' ? 'border-l-purple-500' : p.color === 'emerald' ? 'border-l-emerald-500' : 'border-l-blue-500'}`}>
                                    <div className="flex justify-between items-start mb-3 pl-2">
                                        <div className="flex items-center gap-2">
                                            <Icon name={p.icon} size={20} className="text-slate-400" />
                                            <span className="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600 border border-slate-200">{p.client}</span>
                                        </div>
                                        <Badge color={p.color}>{p.status}</Badge>
                                    </div>
                                    <h4 className="font-bold text-slate-800 pl-2 text-lg mb-1">{p.title}</h4>
                                    <p className="text-sm text-slate-500 pl-2">{p.note}</p>
                                </Card>
                            ))}
                        </div>
                    </div>

                    {/* Ejecución */}
                    <div>
                        <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4">
                            <Icon name="check-circle" className="text-emerald-600" size={20} /> En Ejecución & Recurrentes
                        </h3>
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <Card className="border-l-4 border-l-emerald-500">
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center gap-3">
                                        <div className="p-3 bg-emerald-100 rounded-xl text-emerald-700"><Icon name="check-circle" size={24} /></div>
                                        <div>
                                            <h4 className="font-bold text-slate-800 text-lg">GRAMOSA Ing.</h4>
                                            <p className="text-xs text-slate-500">Consultoría Activa</p>
                                        </div>
                                    </div>
                                    <Badge color="emerald">EN EJECUCIÓN</Badge>
                                </div>
                                <ProgressBar progress={83} label="213 / 256 HH" />
                            </Card>

                            <div className="grid gap-3">
                                {[
                                    { title: "SuKarne Póliza", sub: "Atención Contingencia", val: "80 HH YTD", icon: "shield", color: "text-amber-600", bg: "bg-amber-100" },
                                    { title: "Mentorías PH", sub: "Planner/Coord/Ops", val: "74 HH YTD", icon: "users", color: "text-indigo-600", bg: "bg-indigo-100" },
