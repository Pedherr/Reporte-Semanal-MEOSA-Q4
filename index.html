<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOSA 2026 | Dashboard de Avance</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilos de Impresión Premium */
        @media print {
            @page { size: landscape; margin: 0.5cm; }
            body { background-color: white !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; width: 100%; }
            .card-visual { border: 1px solid #cbd5e1 !important; box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; margin-bottom: 1rem; background-color: white !important; }
            .bg-slate-50 { background-color: #f8fafc !important; }
            
            /* Ajustes Tabla Impresión */
            table { font-size: 11px !important; width: 100%; }
            th, td { padding: 6px 4px !important; }
            
            /* Forzar visualización de barras de progreso */
            .print-progress-bg { background-color: #e2e8f0 !important; }
            .print-progress-fill { background-color: #10b981 !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="root"></div>

    <script type="text/babel">
        // Helper Icon Component
        const Icon = ({ name, size = 24, className = "" }) => {
            React.useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        const LAST_UPDATED = "24 de Enero, 2026"; 
        const HOURLY_RATE = 900;

        // --- DATOS MAESTROS ---
        
        const financialHistory = [
            { week: 'Semana 01 (02-03 Ene)', gramosaHours: 0, flexibleHours: 0, mentoriaHours: 1, activity: 'Arranque Año: Mentoría Edson (Coordinador).', status: 'Cerrado' },
            { week: 'Semana 02 (05-09 Ene)', gramosaHours: 6, flexibleHours: 0, mentoriaHours: 9, activity: 'GRAMOSA (6h Pkg), Foco Mentoría: Germán Ortiz (Planner).', status: 'Cerrado' },
            { week: 'Semana 03 (12-16 Ene)', gramosaHours: 10, flexibleHours: 4, mentoriaHours: 6, activity: 'GRAMOSA(10h), PFD(3h), Póliza SK(1h), Ment. Germán(5h)/Edson(1h).', status: 'Cerrado' },
            { week: 'Semana 04 (19-23 Ene)', gramosaHours: 14, flexibleHours: 7, mentoriaHours: 9, activity: 'GRAMOSA(14h), Póliza SK(7h), Ment. Germán(6h)/Edson(1h)/Johan(2h).', status: 'Cerrado' }
        ];

        const portfolioData = {
          strategic: [
            { id: 'pilgrims', client: 'PILGRIMS', title: 'Ingeniería BIM / Peletizado', status: 'Cotización 80%', note: 'Cierre inminente 26/01.', icon: 'building-2', color: 'blue' },
            { id: 'altosano-med', client: 'ALTO SANO', title: 'Instalación Medidores Flujo', status: 'Req. Recibido', note: 'Nuevo requerimiento (23/01).', icon: 'activity', color: 'cyan' },
            { id: 'altosano-pan', client: 'ALTO SANO', title: 'Instalación de Paneles', status: 'Req. Recibido', note: 'Nuevo requerimiento (23/01).', icon: 'zap', color: 'cyan' },
            { id: 'sukarne', client: 'SuKarne', title: 'Soporte Universidad SK', status: 'Definiendo Alcance', note: 'Levantamiento listo. Modelando.', icon: 'users', color: 'blue' },
            { id: 'adm-planos', client: 'ADM', title: 'Levantamiento Planos', status: 'Vigente', note: 'Propuesta activa.', icon: 'layout', color: 'blue' },
            { id: 'adm-tanques', client: 'ADM', title: 'Documentación Tanques', status: 'Rechazada', note: 'Archivar lecciones.', icon: 'x-circle', color: 'red' }
          ],
          approved: [
            { id: 'gramosa', client: 'GRAMOSA', title: 'Ingeniería Consultoría', status: 'En Ejecución', deadline: 'Feb 2026', note: 'Avance sólido (+14h esta semana).', icon: 'check-circle', progress: 55, totalHH: '142 / 256 HH' }
          ],
          recurring: [
            { id: 'poliza', client: 'SuKarne', title: 'Póliza Mantenimiento', status: 'Activo', note: 'Gestión Michoacán.', icon: 'shield' },
            { id: 'pfd', client: 'MEOSA', title: 'Proyecto PFD', status: 'Pausa Táctica', note: 'Retomar sesión trabajo.', icon: 'activity' },
            { id: 'mentoria', client: 'MEOSA', title: 'Mentorías Internas', status: 'Continuo', note: 'Equipo completo activado.', icon: 'users' }
          ]
        };

        const modelsData = [
            { 
                type: 'Proyecto Cerrado', desc: 'Entregables + Hitos + Pagos', color: 'bg-emerald-500', icon: 'check-circle',
                items: [{ label: 'GRAMOSA', value: 'Avance acumulado: 142 HH (55%)', highlight: true }]
            },
            { 
                type: 'Gestión Cotizaciones', desc: 'Pipeline Comercial Activo', color: 'bg-blue-500', icon: 'clipboard-list',
                items: [
                    { label: 'Pilgrim\'s (BIM)', status: 'AL 80%', date: 'Cierre: 26/01' },
                    { label: 'Alto Sano (2 Props)', status: 'NUEVO', date: 'Recibido 23/01' },
                    { label: 'ADM (Planos)', status: 'COTIZADO', date: 'Vigente' },
                    { label: 'SuKarne (Uni)', status: 'EN PROCESO', date: 'Diagramando' }
                ]
            },
            { 
                type: 'HH Consumidas', desc: 'Bolsa / Póliza / Soporte', color: 'bg-amber-500', icon: 'shield',
                items: [
                    { label: 'SuKarne Póliza', value: '8 HH (Gestión)', sub: 'Acumulado Enero' },
                    { label: 'PFD (Ventas)', value: '3 HH (Alcance)', sub: 'Acumulado Enero' }
                ]
            },
            { 
                type: 'Mentorías', desc: 'Desarrollo de Roles', color: 'bg-indigo-500', icon: 'graduation-cap',
                items: [
                    { label: 'Planner (Germán)', value: '20h. Control.' },
                    { label: 'Coord (Edson)', value: '3h. Implementación.' },
                    { label: 'Ops (Johan)', value: '2h. Activación.' }
                ]
            }
        ];

        const alignmentPoints = [
            { title: 'Tracción Operativa', text: 'Semana de alta ejecución (30 HH totales). GRAMOSA avanza sólido y Póliza SK retoma control estratégico.' },
            { title: 'Avance Comercial', text: 'SuKarne Uni: Del concepto a la realidad. Pilgrim\'s al 80%. Alto Sano entra con 2 requerimientos nuevos.' },
            { title: 'Recursos Internos', text: 'Equipo completo en cancha. Johan López activo (2h). Germán mantiene liderazgo en horas (20h acumuladas).' },
            { title: 'Ajuste PFD', text: 'Se integraron 3h de Daniel Zepeda en Sem 3. Proyecto requiere constancia para evitar rezago.' }
        ];

        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

        // --- COMPONENTES UI ---

        const Card = ({ children, className = '' }) => (
            <div className={`bg-white rounded-xl shadow-md border border-slate-200 p-6 card-visual transition-shadow hover:shadow-lg ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ children, color = 'blue' }) => {
            const colors = {
                blue: 'bg-blue-100 text-blue-800 border-blue-200', emerald: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                amber: 'bg-amber-100 text-amber-800 border-amber-200', red: 'bg-red-100 text-red-800 border-red-200',
                cyan: 'bg-cyan-100 text-cyan-800 border-cyan-200', purple: 'bg-purple-100 text-purple-800 border-purple-200'
            };
            return <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border ${colors[color] || colors.blue}`}>{children}</span>;
        };

        const ProgressBar = ({ progress, label }) => (
            <div className="w-full mt-4">
                <div className="flex justify-between text-xs mb-1">
                    <span className="font-bold text-slate-700">Progreso HH</span>
                    <span className="text-slate-500 font-mono">{label}</span>
                </div>
                <div className="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden print-progress-bg">
                    <div className="bg-emerald-500 h-2.5 rounded-full print-progress-fill" style={{ width: `${progress}%` }}></div>
                </div>
            </div>
        );

        const SectionHeader = ({ title, subtitle, icon }) => (
            <div className="mb-6 flex items-center gap-3 border-b-2 border-slate-100 pb-3">
                <div className="p-2 bg-white border border-slate-200 rounded-lg text-slate-700 shadow-sm">
                    <Icon name={icon} size={24} />
                </div>
                <div>
                    <h2 className="text-2xl font-bold text-slate-800 leading-none">{title}</h2>
                    <p className="text-slate-500 text-sm mt-1">{subtitle}</p>
                </div>
            </div>
        );

        // --- VISTAS ---

        const ViewVision = () => (
            <div className="space-y-6 animate-fadeIn">
                <div className="flex justify-between items-end mb-2">
                    <div>
                        <h3 className="text-2xl font-black text-slate-800 flex items-center gap-2">
                            <Icon name="bar-chart-3" className="text-blue-600" /> Cierre Mensual: Enero 2026
                        </h3>
                        <p className="text-slate-500 font-medium">Resultados Acumulados (Semanas 1-4)</p>
                    </div>
                </div>
                
                <div className="grid md:grid-cols-2 gap-6">
                    <Card className="border-l-4 border-l-emerald-500">
                        <div className="flex items-start gap-4">
                            <div className="p-3 bg-emerald-50 rounded-xl text-emerald-600 border border-emerald-100 shadow-sm"><Icon name="check-circle" size={28} /></div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 mb-2">Hitos Cumplidos</h3>
                                <ul className="text-sm text-slate-600 space-y-2">
                                    <li className="flex items-center gap-2"><Icon name="check" size={14} className="text-emerald-500" /> <strong>SuKarne Uni:</strong> Levantamiento listo.</li>
                                    <li className="flex items-center gap-2"><Icon name="check" size={14} className="text-emerald-500" /> <strong>GRAMOSA:</strong> Ritmo fuerte (+14h).</li>
                                    <li className="flex items-center gap-2"><Icon name="check" size={14} className="text-emerald-500" /> <strong>Mentorías:</strong> Equipo 100% activo.</li>
                                </ul>
                            </div>
                        </div>
                    </Card>
                    <Card className="border-l-4 border-l-blue-500">
                        <div className="flex items-start gap-4">
                            <div className="p-3 bg-blue-50 rounded-xl text-blue-600 border border-blue-100 shadow-sm"><Icon name="target" size={28} /></div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800 mb-2">Foco Cierre Enero</h3>
                                <ul className="text-sm text-slate-600 space-y-2">
                                    <li className="flex items-center gap-2"><Icon name="arrow-right" size={14} className="text-blue-500" /> <span className="font-bold text-blue-700">Pilgrim's:</span> Cerrar cotización.</li>
                                    <li className="flex items-center gap-2"><Icon name="arrow-right" size={14} className="text-blue-500" /> <span className="font-bold text-blue-700">SuKarne:</span> Modelar Diagrama.</li>
                                    <li className="flex items-center gap-2"><Icon name="arrow-right" size={14} className="text-blue-500" /> <span className="font-bold text-blue-700">Alto Sano:</span> Iniciar props.</li>
                                </ul>
                            </div>
                        </div>
                    </Card>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                    <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 text-center shadow-sm">
                        <div className="text-3xl font-black text-emerald-600">55%</div>
                        <div className="text-xs font-bold text-emerald-800 uppercase tracking-wider mt-1">Avance Gramosa</div>
                    </div>
                    <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 text-center shadow-sm">
                        <div className="text-3xl font-black text-blue-600">80%</div>
                        <div className="text-xs font-bold text-blue-800 uppercase tracking-wider mt-1">Cot. Pilgrim's</div>
                    </div>
                    <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-center shadow-sm">
                        <div className="text-3xl font-black text-amber-600">25h</div>
                        <div className="text-xs font-bold text-amber-800 uppercase tracking-wider mt-1">Mentorías Acum.</div>
                    </div>
                    <div className="bg-slate-100 p-4 rounded-xl border border-slate-200 text-center shadow-sm">
                        <div className="text-3xl font-black text-slate-600">OK</div>
                        <div className="text-xs font-bold text-slate-700 uppercase tracking-wider mt-1">Levant. SK</div>
                    </div>
                </div>
            </div>
        );

        const ViewFinancials = () => {
            const totalGramosa = financialHistory.reduce((acc, curr) => acc + curr.gramosaHours, 0);
            const totalFlexible = financialHistory.reduce((acc, curr) => acc + curr.flexibleHours, 0);
            const totalMentoria = financialHistory.reduce((acc, curr) => acc + curr.mentoriaHours, 0);
            const totalHours = totalGramosa + totalFlexible + totalMentoria;
            const totalBillable = totalFlexible + totalMentoria;
            const totalCost = totalBillable * HOURLY_RATE;

            return (
                <div className="space-y-6">
                    <SectionHeader title="Control Financiero" subtitle="Desglose Semanal y Acumulado (Enero)" icon="calculator" />
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <Card className="bg-slate-50 border-slate-200 !p-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs text-slate-500 uppercase font-bold">Ocupación Total</p>
                                    <p className="text-3xl font-black text-slate-800 mt-1">{totalHours} h</p>
                                </div>
                                <Icon name="clock" className="text-slate-300" />
                            </div>
                        </Card>
                        <Card className="bg-purple-50 border-purple-200 !p-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs text-purple-700 uppercase font-bold">Fijo (Gramosa)</p>
                                    <p className="text-3xl font-black text-purple-900 mt-1">{totalGramosa} h</p>
                                </div>
                                <Icon name="briefcase" className="text-purple-300" />
                            </div>
                        </Card>
                        <Card className="bg-blue-50 border-blue-200 !p-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs text-blue-700 uppercase font-bold">Costeables</p>
                                    <p className="text-3xl font-black text-blue-900 mt-1">{totalBillable} h</p>
                                </div>
                                <Icon name="target" className="text-blue-300" />
                            </div>
                        </Card>
                        <Card className="bg-emerald-50 border-emerald-200 !p-4">
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs text-emerald-700 uppercase font-bold">Inversión Var.</p>
                                    <p className="text-2xl font-black text-emerald-700 mt-1 tracking-tight">{formatMoney(totalCost)}</p>
                                </div>
                                <Icon name="dollar-sign" className="text-emerald-400" />
                            </div>
                        </Card>
                    </div>

                    <div className="overflow-hidden rounded-xl border border-slate-200 shadow-sm card-visual">
                        <table className="w-full text-sm text-left">
                            <thead className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200">
                                <tr>
                                    <th className="px-6 py-3">Semana</th>
                                    <th className="px-6 py-3">Actividad</th>
                                    <th className="px-6 py-3 text-center">Total</th>
                                    <th className="px-6 py-3 text-center text-purple-700">Fijo</th>
                                    <th className="px-6 py-3 text-center text-blue-700">Flex</th>
                                    <th className="px-6 py-3 text-center text-indigo-700">Ment</th>
                                    <th className="px-6 py-3 text-right">Costo Sem.</th>
                                    <th className="px-6 py-3 text-right">Costo Acum.</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 bg-white">
                                {financialHistory.map((row, i) => {
                                    const accBillable = financialHistory.slice(0, i+1).reduce((a,c) => a + c.flexibleHours + c.mentoriaHours, 0);
                                    const periodBillable = row.flexibleHours + row.mentoriaHours;
                                    const periodCost = periodBillable * HOURLY_RATE;
                                    const accCost = accBillable * HOURLY_RATE;
                                    const totalRow = row.gramosaHours + row.flexibleHours + row.mentoriaHours;
                                    return (
                                        <tr key={i} className="hover:bg-slate-50 transition-colors">
                                            <td className="px-6 py-4 font-medium text-slate-700">{row.week}</td>
                                            <td className="px-6 py-4 text-slate-600 text-xs max-w-xs">{row.activity}</td>
                                            <td className="px-6 py-4 text-center font-bold">{totalRow} h</td>
                                            <td className="px-6 py-4 text-center text-purple-600 bg-purple-50/30 font-bold">{row.gramosaHours || '-'}</td>
                                            <td className="px-6 py-4 text-center text-blue-600 bg-blue-50/30 font-bold">{row.flexibleHours || '-'}</td>
                                            <td className="px-6 py-4 text-center text-indigo-600 bg-indigo-50/30 font-bold">{row.mentoriaHours || '-'}</td>
                                            <td className="px-6 py-4 text-right font-mono text-slate-600">{formatMoney(periodCost)}</td>
                                            <td className="px-6 py-4 text-right font-mono font-bold text-emerald-700">{formatMoney(accCost)}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                            <tfoot className="bg-slate-100 font-bold text-slate-800 border-t-2 border-slate-300">
                                <tr>
                                    <td className="px-6 py-4 text-right" colSpan="2">TOTALES ENERO</td>
                                    <td className="px-6 py-4 text-center">{totalHours} h</td>
                                    <td className="px-6 py-4 text-center text-purple-800">{totalGramosa} h</td>
                                    <td className="px-6 py-4 text-center text-blue-800">{totalFlexible} h</td>
                                    <td className="px-6 py-4 text-center text-indigo-800">{totalMentoria} h</td>
                                    <td className="px-6 py-4 text-right text-slate-900">-</td>
                                    <td className="px-6 py-4 text-right text-emerald-800">{formatMoney(totalCost)}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            );
        };

        const ViewPortfolio = () => (
            <div className="space-y-6 animate-fadeIn">
                <SectionHeader title="Portafolio de Cuentas" subtitle="Estatus de Frentes Activos" icon="briefcase" />
                
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {portfolioData.strategic.map((p, i) => (
                        <Card key={i} className={`relative overflow-hidden group hover:shadow-lg transition-all border-l-4 ${p.color === 'red' ? 'border-l-red-500' : p.color === 'cyan' ? 'border-l-cyan-500' : 'border-l-blue-500'}`}>
                            <div className="flex justify-between items-start mb-3 pl-2">
                                <div className="flex items-center gap-2">
                                    <Icon name={p.icon} size={20} className="text-slate-400" />
                                    <span className="text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600">{p.client}</span>
                                </div>
                                <Badge color={p.color}>{p.status}</Badge>
                            </div>
                            <h4 className="font-bold text-slate-800 pl-2 text-lg mb-1">{p.title}</h4>
                            <p className="text-sm text-slate-500 pl-2">{p.note}</p>
                        </Card>
                    ))}
                </div>

                <div className="mt-8">
                    <h4 className="font-bold text-slate-700 mb-4 flex items-center gap-2 border-b border-slate-200 pb-2">
                        <Icon name="check-circle" size={18} /> En Ejecución & Recurrentes
                    </h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {portfolioData.approved.concat(portfolioData.recurring).map((p, i) => (
                            <div key={i} className="flex flex-col p-5 bg-white border border-slate-200 rounded-xl shadow-sm card-visual hover:border-emerald-200 transition-colors">
                                <div className="flex justify-between items-start">
                                    <div className="flex items-center gap-4">
                                        <div className={`p-3 rounded-full ${p.id === 'gramosa' ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}`}>
                                            <Icon name={p.icon} size={24} />
                                        </div>
                                        <div>
                                            <p className="font-bold text-slate-800 text-lg">{p.title}</p>
                                            <p className="text-sm text-slate-500 flex items-center gap-1 font-medium">
                                                {p.client} • {p.note}
                                            </p>
                                        </div>
                                    </div>
                                    <Badge color={p.id === 'gramosa' ? 'emerald' : 'amber'}>{p.status}</Badge>
                                </div>
                                {p.progress && (
                                    <div className="mt-2 pl-16">
                                        <ProgressBar progress={p.progress} label={p.totalHH} />
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const ViewModels = () => (
            <div className="space-y-6 animate-fadeIn">
                <SectionHeader title="Modelos de Gestión" subtitle="Actividad detallada por esquema" icon="layout" />
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {modelsData.map((m, idx) => (
                        <Card key={idx} className="hover:border-blue-300 transition-colors">
                            <div className="flex items-start justify-between mb-4">
                                <div>
                                    <div className={`h-1.5 w-12 ${m.color} rounded-full mb-2`}></div>
                                    <h4 className="font-bold text-xl text-slate-800">{m.type}</h4>
                                    <p className="text-xs text-slate-500 uppercase tracking-wide font-semibold">{m.desc}</p>
                                </div>
                                <div className={`p-2 rounded-lg ${m.color} bg-opacity-10 text-slate-600`}>
                                    <Icon name={m.icon} size={24} />
                                </div>
                            </div>
                            <div className="bg-slate-50 rounded-lg p-4 border border-slate-100 space-y-3">
                                {m.items.map((item, i) => (
                                    <div key={i} className="flex justify-between items-start text-sm border-b border-slate-200 pb-2 last:border-0 last:pb-0">
                                        <div className="flex flex-col">
                                            <span className="font-bold text-slate-700">{item.label}</span>
                                            {item.sub && <span className="text-xs text-slate-400">{item.sub}</span>}
                                            {item.value && <span className="text-slate-600 mt-0.5">{item.value}</span>}
                                        </div>
                                        {item.status && (
