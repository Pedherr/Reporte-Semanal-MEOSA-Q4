<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEOSA 2026 | Centro de Mando Estratégico</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel (Motor Robusto UMD) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        
        .animate-enter { animation: enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes enter { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .card-elite {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease-in-out;
        }
        .card-elite:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
            border-color: #cbd5e1;
        }

        .timeline-line::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background-color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="root"></div>

    <script type="module">
        import React, { useState } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        
        // Importar Iconos
        import { 
            Briefcase, Target, CheckCircle, Clock, Layout, Users, 
            Shield, Activity, Zap, Building2, BarChart3, 
            AlertTriangle, X, Menu, Calculator, Layers, XCircle,
            ClipboardList, GraduationCap, DollarSign
        } from 'https://esm.sh/lucide-react@0.263.1';

        const ce = React.createElement;

        // --- CONFIGURACIÓN ---
        const LAST_UPDATED = "07 de Febrero, 2026"; 
        const HOURLY_RATE = 900; 

        // --- DATOS ---
        const financialHistory = [
            { week: 'Sem 01 (02-03 Ene)', gramosa: 0, flex: 0, ment: 1, activity: 'Inicio Año: Mentoría Edson.', status: 'Cerrado' },
            { week: 'Sem 02 (05-09 Ene)', gramosa: 6, flex: 0, ment: 9, activity: 'Gramosa (6h), Foco Planner.', status: 'Cerrado' },
            { week: 'Sem 03 (12-16 Ene)', gramosa: 10, flex: 4, ment: 6, activity: 'Gramosa(10), PFD(3), SK(1), Ment(6).', status: 'Cerrado' },
            { week: 'Sem 04 (19-23 Ene)', gramosa: 14, flex: 7, ment: 9, activity: 'Gramosa(14), SK(7), Ment(9).', status: 'Cerrado' },
            { week: 'Sem 05 (26-30 Ene)', gramosa: 12, flex: 5, ment: 10, activity: 'Gramosa(12), Flex(5), Ment(10).', status: 'Cerrado' },
            // Semana 6 Febrero
            { week: 'Sem 06 (02-06 Feb)', gramosa: 6, flex: 11, ment: 7, activity: 'USK Lev.(6), SK Pol.(5), Gram(6), Ment(7).', status: 'Abierto' }
        ];

        const portfolioData = {
          strategic: [
            { id: 'pilgrims', client: 'PILGRIMS', title: 'Ingeniería BIM / Peletizado', status: 'PROP. ENVIADA', note: 'Enviada 26/01. Esperando feedback.', icon: Building2, color: 'emerald' },
            { id: 'altosano-med', client: 'ALTO SANO', title: 'Instalación Medidores Flujo', status: 'ENTREGADA', note: 'Propuesta entregada 30/01.', icon: CheckCircle, color: 'emerald' },
            { id: 'altosano-pan', client: 'ALTO SANO', title: 'Instalación de Paneles', status: 'RETRASO 10/02', note: 'Reprogramado para el 10/02.', icon: Zap, color: 'amber' },
            { id: 'sukarne', client: 'SuKarne', title: 'Soporte Universidad SK', status: 'CITA 11/02', note: 'Levantamiento OK. Cierre propuesta.', icon: Users, color: 'blue' },
            { id: 'adm-planos', client: 'ADM', title: 'Levantamiento Planos', status: 'VIGENTE', note: 'Propuesta activa.', icon: Layout, color: 'blue' },
            { id: 'adm-tanques', client: 'ADM', title: 'Documentación Tanques', status: 'RECHAZADA', note: 'Archivar lecciones.', icon: XCircle, color: 'red' }
          ],
          approved: [
            { id: 'gramosa', client: 'GRAMOSA', title: 'Ingeniería Consultoría', status: 'En Ejecución', deadline: 'Feb 2026', note: 'Acum: 160 HH (+6h esta sem).', icon: CheckCircle, progress: 62.5, totalHH: '160 / 256 HH' }
          ],
          recurring: [
            { id: 'poliza', client: 'SuKarne', title: 'Póliza Mantenimiento', status: 'Intenso', note: '11h Sem (Levantamiento+Poliza).', icon: Shield },
            { id: 'pfd', client: 'MEOSA', title: 'Proyecto PFD', status: 'Alineación', note: '1h Edson (Plan Piloto).', icon: Activity },
            { id: 'mentoria', client: 'MEOSA', title: 'Mentorías Internas', status: 'Activo', note: '7h Sem (Foco Planner).', icon: Users }
          ]
        };

        const modelsData = [
            { type: 'Proyecto Cerrado', desc: 'Entregables + Hitos (Fijo)', color: 'bg-emerald-500', text: 'text-emerald-700', bg: 'bg-emerald-50', icon: CheckCircle, items: [{ label: 'GRAMOSA', value: 'Avance: 160 HH (62.5%)' }] },
            { type: 'Gestión Cotizaciones', desc: 'Pipeline Comercial', color: 'bg-blue-500', text: 'text-blue-700', bg: 'bg-blue-50', icon: ClipboardList, items: [{ label: "Pilgrim's", status: 'ENVIADA' }, { label: 'Alto Sano (Pan)', status: '10/02' }, { label: 'USK Mich.', status: '11/02' }] },
            { type: 'HH Consumidas', desc: 'Póliza / Soporte (Variable)', color: 'bg-amber-500', text: 'text-amber-700', bg: 'bg-amber-50', icon: Shield, items: [{ label: 'SuKarne (Pol+USK)', value: '18 HH (YTD)' }, { label: 'PFD', value: '6 HH (YTD)' }, { label: 'Total Feb (Sem 6)', value: '12 HH' }] },
            { type: 'Mentorías', desc: 'Desarrollo Roles (Variable)', color: 'bg-indigo-500', text: 'text-indigo-700', bg: 'bg-indigo-50', icon: GraduationCap, items: [{ label: 'Planner', value: '33h (YTD)' }, { label: 'Coord', value: '5h (YTD)' }, { label: 'Ops', value: '3h (YTD)' }] }
        ];

        const alignmentPoints = [
            { title: 'Arranque Febrero', text: 'Inicio fuerte con USK Michoacán (6h). Se mantiene ritmo en Gramosa (6h) y se intensifica Póliza SK.' },
            { title: 'Entregables Alto Sano', text: 'Medidores entregado 30/01. Paneles REPROGRAMADO para el 10/02. Seguimiento prioritario.' },
            { title: 'Cierre USK', text: 'Levantamiento Michoacán completado. Cita con cliente confirmada para el Miércoles 11/02.' },
            { title: 'Desarrollo Interno', text: 'Germán (Planner) continúa desarrollo (5h esta sem). Edson alinea piloto PFD (1h).' }
        ];

        const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);

        // --- COMPONENTES UI ---

        const Card = ({ children, className = '' }) => ce(
            'div',
            { className: `card-elite p-6 ${className}` },
            children
        );

        const Badge = ({ children, color = 'blue' }) => {
            const colors = {
                blue: 'bg-blue-50 text-blue-700 border-blue-200', 
                emerald: 'bg-emerald-50 text-emerald-700 border-emerald-200',
                amber: 'bg-amber-50 text-amber-700 border-amber-200', 
                red: 'bg-red-50 text-red-700 border-red-200',
                cyan: 'bg-cyan-50 text-cyan-700 border-cyan-200',
                purple: 'bg-purple-50 text-purple-700 border-purple-200',
                slate: 'bg-slate-100 text-slate-700 border-slate-300' 
            };
            return ce(
                'span',
                { className: `px-3 py-1 rounded-md text-[10px] font-bold border uppercase tracking-wider ${colors[color] || colors.blue}` },
                children
            );
        };

        const ProgressBar = ({ progress, label, color = "emerald" }) => ce('div', { className: "w-full mt-4" },
            ce('div', { className: "flex justify-between text-xs mb-1.5 font-semibold text-slate-600" },
                ce('span', null, "Avance HH"),
                ce('span', { className: "text-slate-900 font-mono" }, label)
            ),
            ce('div', { className: "w-full bg-slate-100 rounded-full h-2.5 overflow-hidden border border-slate-200 shadow-inner" },
                ce('div', { 
                    className: `h-full rounded-full transition-all duration-1000 shadow-sm ${color === 'emerald' ? 'bg-emerald-500' : 'bg-blue-500'}`, 
                    style: { width: `${progress}%` } 
                })
            )
        );

        const SectionHeader = ({ title, subtitle, icon }) => ce(
            'div',
            { className: "mb-8 flex items-center gap-4 border-b border-slate-200 pb-4" },
            ce('div', { className: "p-3 bg-white border border-slate-200 rounded-xl text-slate-800 shadow-sm" },
                ce(icon, { size: 24 })
            ),
            ce('div', null,
                ce('h2', { className: "text-2xl font-bold text-slate-900 leading-none" }, title),
                ce('p', { className: "text-slate-500 text-sm mt-1" }, subtitle)
            )
        );

        // --- VISTAS ---

        const ViewFinancials = () => {
            const calculateTotals = (data) => data.reduce((acc, row) => ({
                gramosa: acc.gramosa + row.gramosa,
                flex: acc.flex + row.flex,
                ment: acc.ment + row.ment,
                total: acc.total + row.gramosa + row.flex + row.ment
            }), { gramosa: 0, flex: 0, ment: 0, total: 0 });

            // Enero (Sem 1-5)
            const rowsJan = financialHistory.slice(0, 5);
            const totalsJan = calculateTotals(rowsJan);
            const costJan = (totalsJan.flex + totalsJan.ment) * HOURLY_RATE;

            // Febrero (Sem 6)
            const rowsFeb = financialHistory.slice(5);
            const totalsFeb = calculateTotals(rowsFeb);
            const costFeb = (totalsFeb.flex + totalsFeb.ment) * HOURLY_RATE;

            // Grand Total
            const grandTotalHours = totalsJan.total + totalsFeb.total;
            const grandTotalCost = costJan + costFeb;

            return ce('div', { className: "space-y-8 animate-enter" },
                ce(SectionHeader, { title: "Control Financiero", subtitle: "Cierre Enero (Consolidado) & Avance Febrero", icon: Calculator }),
                
                // Summary Cards
                ce('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                    ce('div', { className: "bg-slate-800 rounded-xl p-6 text-white shadow-xl flex justify-between items-center" },
                        ce('div', null,
                            ce('p', { className: "text-slate-400 text-xs font-bold uppercase tracking-wider mb-1" }, "Cierre Definitivo Enero"),
                            ce('h3', { className: "text-3xl font-black" }, formatMoney(costJan)),
                            ce('div', { className: "flex gap-3 mt-2 text-xs text-slate-300" },
                                ce('span', null, "Total: ", ce('strong', null, totalsJan.total + "h")),
                                ce('span', null, "•"),
                                ce('span', null, "Var: ", ce('strong', null, (totalsJan.flex + totalsJan.ment) + "h")),
                                ce('span', null, "•"),
                                ce('span', null, "Fijo: ", ce('strong', null, totalsJan.gramosa + "h"))
                            )
                        ),
                        ce('div', { className: "p-3 bg-white/10 rounded-lg" }, ce(CheckCircle, { size: 32 }))
                    ),

                    ce('div', { className: "bg-white border border-emerald-200 rounded-xl p-6 shadow-md flex justify-between items-center" },
                        ce('div', null,
                            ce('p', { className: "text-emerald-600 text-xs font-bold uppercase tracking-wider mb-1" }, "Avance Febrero (Sem 6)"),
                            ce('h3', { className: "text-3xl font-black text-slate-800" }, formatMoney(costFeb)),
                            ce('div', { className: "flex gap-3 mt-2 text-xs text-slate-500" },
                                ce('span', null, "Total: ", ce('strong', null, totalsFeb.total + "h")),
                                ce('span', null, "•"),
                                ce('span', null, "Var: ", ce('strong', null, (totalsFeb.flex + totalsFeb.ment) + "h"))
                            )
                        ),
                        ce('div', { className: "p-3 bg-emerald-50 rounded-lg text-emerald-600" }, ce(Activity, { size: 32 }))
                    )
                ),

                // Consolidated Table
                ce('div', { className: "border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white" },
                    ce('table', { className: "w-full text-sm text-left border-collapse" },
                        ce('thead', { className: "bg-slate-50 text-slate-700 font-bold uppercase text-xs border-b border-slate-200" },
                            ce('tr', null,
                                ce('th', { className: "px-6 py-4 border-r border-slate-100" }, "Periodo"),
                                ce('th', { className: "px-6 py-4 w-1/3 border-r border-slate-100" }, "Actividad Clave"),
                                ce('th', { className: "px-4 py-4 text-center bg-slate-100/50 border-r border-slate-100" }, "Total"),
                                ce('th', { className: "px-4 py-4 text-center text-purple-700 bg-purple-50/30 border-r border-purple-100" }, "Fijo"),
                                ce('th', { className: "px-4 py-4 text-center text-blue-700 bg-blue-50/30 border-r border-blue-100" }, "Flex"),
                                ce('th', { className: "px-4 py-4 text-center text-indigo-700 bg-indigo-50/30 border-r border-indigo-100" }, "Ment"),
                                ce('th', { className: "px-6 py-4 text-right bg-emerald-50 text-emerald-900" }, "Inversión")
                            )
                        ),
                        
                        // Enero Group
                        ce('tbody', { className: "divide-y divide-slate-100 border-b-2 border-slate-200" },
                            ce('tr', { className: "bg-slate-50/50" }, ce('td', { colSpan: "7", className: "px-6 py-2 text-xs font-bold text-slate-500 uppercase tracking-widest" }, "Enero 2026")),
                            rowsJan.map((row, i) => {
                                const weeklyCost = (row.flex + row.ment) * HOURLY_RATE;
                                return ce('tr', { key: i, className: "hover:bg-slate-50 transition-colors group" },
                                    ce('td', { className: "px-6 py-4 font-medium text-slate-700 border-r border-slate-100" }, row.week),
                                    ce('td', { className: "px-6 py-4 text-slate-600 text-xs max-w-xs border-r border-slate-100" }, row.activity),
                                    ce('td', { className: "px-4 py-4 text-center font-bold text-slate-900 border-r border-slate-100 bg-slate-50/30" }, `${row.gramosa + row.flex + row.ment} h`),
                                    ce('td', { className: "px-4 py-4 text-center text-purple-700 font-medium bg-purple-50/10 border-r border-purple-50" }, row.gramosa || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-blue-700 font-medium bg-blue-50/10 border-r border-blue-50" }, row.flex || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-indigo-700 font-medium bg-indigo-50/10 border-r border-indigo-50" }, row.ment || '-'),
                                    ce('td', { className: "px-6 py-4 text-right text-emerald-800 bg-emerald-50/10 font-mono" }, formatMoney(weeklyCost))
                                );
                            }),
                            // Subtotal Enero
                            ce('tr', { className: "bg-slate-100 font-bold text-slate-800" },
                                ce('td', { colSpan: 2, className: "px-6 py-3 text-right text-xs uppercase tracking-wide" }, "Total Enero"),
                                ce('td', { className: "px-4 py-3 text-center bg-slate-200" }, `${totalsJan.total} h`),
                                ce('td', { className: "px-4 py-3 text-center text-purple-900" }, `${totalsJan.gramosa} h`),
                                ce('td', { className: "px-4 py-3 text-center text-blue-900" }, `${totalsJan.flex} h`),
                                ce('td', { className: "px-4 py-3 text-center text-indigo-900" }, `${totalsJan.ment} h`),
                                ce('td', { className: "px-6 py-3 text-right text-emerald-800" }, formatMoney(costJan))
                            )
                        ),

                        // Febrero Group
                        ce('tbody', { className: "divide-y divide-slate-100" },
                            ce('tr', { className: "bg-slate-50/50" }, ce('td', { colSpan: "7", className: "px-6 py-2 text-xs font-bold text-slate-500 uppercase tracking-widest" }, "Febrero 2026")),
                            rowsFeb.map((row, i) => {
                                const weeklyCost = (row.flex + row.ment) * HOURLY_RATE;
                                return ce('tr', { key: i, className: "hover:bg-slate-50 transition-colors group" },
                                    ce('td', { className: "px-6 py-4 font-medium text-slate-700 border-r border-slate-100" }, row.week),
                                    ce('td', { className: "px-6 py-4 text-slate-600 text-xs max-w-xs border-r border-slate-100" }, row.activity),
                                    ce('td', { className: "px-4 py-4 text-center font-bold text-slate-900 border-r border-slate-100 bg-slate-50/30" }, `${row.gramosa + row.flex + row.ment} h`),
                                    ce('td', { className: "px-4 py-4 text-center text-purple-700 font-medium bg-purple-50/10 border-r border-purple-50" }, row.gramosa || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-blue-700 font-medium bg-blue-50/10 border-r border-blue-50" }, row.flex || '-'),
                                    ce('td', { className: "px-4 py-4 text-center text-indigo-700 font-medium bg-indigo-50/10 border-r border-indigo-50" }, row.ment || '-'),
                                    ce('td', { className: "px-6 py-4 text-right text-emerald-800 bg-emerald-50/10 font-mono" }, formatMoney(weeklyCost))
                                );
                            }),
                            // Subtotal Febrero
                            ce('tr', { className: "bg-emerald-50/30 font-bold text-slate-800 border-t border-emerald-100" },
                                ce('td', { colSpan: 2, className: "px-6 py-3 text-right text-xs uppercase tracking-wide text-emerald-900" }, "Parcial Febrero"),
                                ce('td', { className: "px-4 py-3 text-center bg-emerald-100/50" }, `${totalsFeb.total} h`),
                                ce('td', { className: "px-4 py-3 text-center text-purple-900" }, `${totalsFeb.gramosa} h`),
                                ce('td', { className: "px-4 py-3 text-center text-blue-900" }, `${totalsFeb.flex} h`),
                                ce('td', { className: "px-4 py-3 text-center text-indigo-900" }, `${totalsFeb.ment} h`),
                                ce('td', { className: "px-6 py-3 text-right text-emerald-800" }, formatMoney(costFeb))
                            )
                        )
                    ),

                    // Acumulado General
                    ce('div', { className: "flex justify-end mt-4" },
                        ce('div', { className: "text-right bg-slate-800 text-white p-4 rounded-lg shadow-lg" },
                            ce('p', { className: "text-xs font-bold uppercase tracking-widest mb-1 text-slate-400" }, "Acumulado General 2026"),
                            ce('div', { className: "flex items-baseline justify-end gap-2" },
                                ce('p', { className: "text-2xl font-black" }, formatMoney(grandTotalCost)),
                                ce('span', { className: "text-sm font-medium text-slate-400" }, `/ ${grandTotalHours} HH`)
                            )
                        )
                    )
                ),

                ce('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-4 flex items-start gap-3 text-sm text-blue-800" },
                    ce(Layers, { className: "mt-0.5 text-blue-500", size: 18 }),
                    ce('div', null,
                        ce('h4', { className: "font-bold text-blue-900" }, "Regla de Inversión"),
                        ce('p', { className: "text-blue-700 mt-1" }, 
                            "Costo Variable = (Pack Flexible: PFD/SuKarne + Mentorías) x Tarifa. Las horas Fijas (GRAMOSA) no impactan este monto."
                        )
                    )
                )
            );
        };

        const ViewPortfolio = () => {
            return ce('div', { className: "space-y-8 animate-enter" },
                ce(SectionHeader, { title: "Portafolio de Cuentas", subtitle: "Estatus de Frentes Activos", icon: Briefcase }),
                
                // Estratégicos
                ce('div', null,
                    ce('h3', { className: "text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4" },
                        ce(Target, { className: "text-blue-600", size: 20 }), " Frentes Estratégicos & Oportunidades"
                    ),
                    ce('div', { className: "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" },
                        portfolioData.strategic.map((p, i) => 
                            ce('div', { key: i, className: `card-elite p-5 border-l-4 ${p.color === 'red' ? 'border-l-red-500' : p.color === 'cyan' ? 'border-l-cyan-500' : p.color === 'emerald' ? 'border-l-emerald-500' : 'border-l-blue-500'}` },
                                ce('div', { className: "flex justify-between items-start mb-3 pl-2" },
                                    ce('div', { className: "flex items-center gap-2" },
                                        ce(p.icon, { size: 20, className: "text-slate-400" }),
                                        ce('span', { className: "text-xs font-bold bg-slate-100 px-2 py-1 rounded text-slate-600 border border-slate-200" }, p.client)
                                    ),
                                    ce(Badge, { color: p.color }, p.status)
                                ),
                                ce('h4', { className: "font-bold text-slate-800 pl-2 text-lg mb-1" }, p.title),
                                ce('p', { className: "text-sm text-slate-500 pl-2" }, p.note)
                            )
                        )
                    )
                ),

                // Ejecución
                ce('div', null,
                    ce('h3', { className: "text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-4" },
                        ce(CheckCircle, { className: "text-emerald-600", size: 20 }), " En Ejecución & Recurrentes"
                    ),
                    ce('div', { className: "grid grid-cols-1 lg:grid-cols-2 gap-6" },
                        ce(Card, { className: "border-l-4 border-l-emerald-500" },
                            ce('div', { className: "flex justify-between items-start" },
                                ce('div', { className: "flex items-center gap-3" },
                                    ce('div', { className: "p-3 bg-emerald-100 rounded-xl text-emerald-700" }, ce(CheckCircle, { size: 24 })),
                                    ce('div', null,
                                        ce('h4', { className: "font-bold text-slate-800 text-lg" }, "GRAMOSA Ing."),
                                        ce('p', { className: "text-xs text-slate-500" }, "Consultoría Activa")
                                    )
                                ),
                                ce(Badge, { color: "emerald" }, "EN EJECUCIÓN")
                            ),
                            ce(ProgressBar, { progress: 62.5, label: "160 / 256 HH" })
                        ),

                        ce('div', { className: "grid gap-3" },
                            [
                                { title: "SuKarne Póliza", sub: "Gestión Michoacán", val: "18 HH YTD", icon: Shield, color: "text-amber-600", bg: "bg-amber-100" },
                                { title: "Mentorías PH", sub: "Planner/Coord/Ops", val: "42 HH YTD", icon: Users, color: "text-indigo-600", bg: "bg-indigo-100" },
                                { title: "Proyecto PFD", sub: "Alineación", val: "6 HH YTD", icon: Activity, color: "text-purple-600", bg: "bg-purple-100" }
                            ].map((k, i) =>

        const ViewModels = () => ce('div', { className: "space-y-6 animate-enter" },

                modelsData.map((m, idx) =>

                                ce('div', { className: `h-1.5 w-12 ${m.color} rounded-full mb-2` }),
                                ce('h4', { className: "font-bold text-xl text-slate-800" }, m.type),
                                ce('p', { className: "text-xs text-slate-500 uppercase tracking-wide font-semibold" }, m.desc)
                            ),
                            ce('div', { className: `p-2 rounded-lg ${m.bg} ${m.text}` },
                                ce(m.icon, { size: 24 })
                            )
                        ),
                        ce('div', { className: "bg-slate-50 rounded-lg p-4 border border-slate-100 space-y-3" },
                            m.items.map((item, i) => 
                                ce('div', { key: i, className: "flex justify-between items-start text-sm border-b border-slate-200 pb-2 last:border-0 last:pb-0" },

                                    item.status && ce('div', { className: "text-right" },
                                        ce('span', { className: `text-[10px] font-bold px-2 py-1 rounded border ${
                                            item.status === 'NUEVO' ? 'bg-cyan-100 text-cyan-700 border-cyan-200' :
                                            item.status.includes('80%') ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                            item.status === 'ENTREGADA' || item.status === 'ENVIADA' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' :
                                            'bg-white text-slate-600 border-slate-200'
                                        }` }, item.status),
                                        item.date && ce('p', { className: "text-[10px] text-slate-400 mt-1" }, item.date)
                                    )
                                )
                            )

                    )
                )
            )
        );

        const ViewAgenda = () => ce('div', { className: "space-y-6 animate-enter" },
            ce(SectionHeader, { title: "Agenda de Seguimiento", subtitle: "Revisión Semanal (07 Febrero)", icon: Clock }),

                    [
                        { time: '10 min', title: 'Entrega Paneles AS', desc: 'Envío formal reprogramado (Retraso).', tag: '10/02', color: 'amber' },
                        { time: '30 min', title: 'Cierre Universidad USK', desc: 'Reunión definitiva post-visita.', tag: '11/02', color: 'blue' },
                        { time: '15 min', title: 'Seguimiento Pilgrim\'s', desc: 'Validación de feedback propuesta enviada.', tag: 'Comercial', color: 'emerald' },

                                ce('span', { className: `text-xs font-bold text-${item.color}-700 bg-${item.color}-50 px-3 py-1 rounded-full border border-${item.color}-200` }, item.time)

                            ce('p', { className: "text-slate-600 leading-relaxed font-medium border-l-2 border-transparent pl-2 group-hover:border-blue-200 transition-colors" }, item.desc)

            )

            ce('div', null,
                ce('h3', { className: "text-lg font-bold text-slate-800 mb-4 flex items-center gap-2" },
                     ce(BarChart3, { className: "text-blue-600", size: 20 }), " Alineación Estratégica"

                            ce('div', { className: "mt-1 text-emerald-600" }, ce(CheckCircle, { size: 20 })),

                                ce('p', { className: "text-xs font-bold text-emerald-800 uppercase mb-1" }, "Logro Clave"),
                                ce('p', { className: "text-sm text-emerald-900 leading-snug" }, "Enero cierra con $45.9K variables y 60% avance en Gramosa. Inercia positiva.")

                    ),
                    ce(Card, { className: "bg-blue-50 border-blue-200 !p-4 !shadow-none" },
                        ce('div', { className: "flex gap-4" },
                            ce('div', { className: "mt-1 text-blue-600" }, ce(Target, { size: 20 })),
                            ce('div', null,
                                ce('p', { className: "text-xs font-bold text-blue-800 uppercase mb-1" }, "Foco Febrero"),
                                ce('p', { className: "text-sm text-blue-900 leading-snug" }, "Cerrar venta Alto Sano y concretar alcance Universidad SuKarne post-visita.")

                    ce(Card, { className: "bg-red-50 border-red-200 !p-4 !shadow-none" },
                        ce('div', { className: "flex gap-4" },

                            ce('div', null,
                                ce('p', { className: "text-xs font-bold text-red-800 uppercase mb-1" }, "Atención"),
                                ce('p', { className: "text-sm text-red-900 leading-snug" }, "Asegurar que la carga de Gramosa (+12h) no frene el seguimiento comercial de Pilgrim's.")

                        )
                    )
                )
            ),

                     ce(Clock, { className: "text-blue-600", size: 20 }), " Visión General Sem 07"
                 ),
                 ce(Card, { className: "border-l-4 border-l-blue-500" },
                     ce('div', { className: "space-y-4" },
                         ce('p', { className: "text-sm text-slate-600 font-medium" }, "Semana crítica para cierres comerciales. El foco debe estar en la conversión de propuestas enviadas."),

                             ce('div', { className: "bg-slate-50 p-2 rounded" }, 
                                 ce('strong', { className: "block text-slate-800" }, "Meta 2"), "Entrega AS Paneles"
                             )
                         )
                     )
                 )
             )
        );

        const ViewVision = () => ce('div', { className: "space-y-8 animate-enter" },
            ce('div', { className: "flex flex-col md:flex-row md:justify-between md:items-end mb-2 gap-4" },

            ce('div', { className: "grid md:grid-cols-2 gap-6" },
                ce(Card, { className: "border-l-4 border-l-emerald-500" },
                    ce('div', { className: "flex items-start gap-5" },
                        ce('div', { className: "p-4 bg-emerald-50 rounded-2xl text-emerald-600 border border-emerald-100 shadow-inner" }, ce(CheckCircle, { size: 32 })),

                                ce('li', { className: "flex items-center gap-2" }, ce(CheckCircle, { size: 16, className: "text-emerald-500" }), ce('strong', null, "Alto Sano:"), " Medidores entregado 30/01."),

                    ce('div', { className: "flex items-start gap-5" },

                            )
                        )
                    )
                )
            ),

            ce('div', { className: "grid grid-cols-2 md:grid-cols-4 gap-4 mt-6" },
                ce('div', { className: "bg-emerald-50 p-5 rounded-2xl border border-emerald-200 text-center shadow-sm hover:shadow-md transition-shadow" },
                    ce('div', { className: "text-4xl font-black text-emerald-600 tracking-tighter" }, "62.5%"),
                    ce('div', { className: "text-xs font-bold text-emerald-800 uppercase tracking-widest mt-2 border-t border-emerald-200 pt-2" }, "Avance Gramosa")
                ),
                ce('div', { className: "bg-blue-50 p-5 rounded-2xl border border-blue-200 text-center shadow-sm hover:shadow-md transition-shadow" },
                    ce('div', { className: "text-4xl font-black text-blue-600 tracking-tighter" }, "ENVIADA"),
                    ce('div', { className: "text-xs font-bold text-blue-800 uppercase tracking-widest mt-2 border-t border-blue-200 pt-2" }, "Cot. Pilgrim's")
                ),
                ce('div', { className: "bg-amber-50 p-5 rounded-2xl border border-amber-200 text-center shadow-sm hover:shadow-md transition-shadow" },
                    ce('div', { className: "text-4xl font-black text-amber-600 tracking-tighter" }, "42h"),
                    ce('div', { className: "text-xs font-bold text-amber-800 uppercase tracking-widest mt-2 border-t border-amber-200 pt-2" }, "Mentorías YTD")
                ),
                ce('div', { className: "bg-white p-5 rounded-2xl border border-slate-200 text-center shadow-sm hover:shadow-md transition-shadow" },
                    ce('div', { className: "text-4xl font-black text-slate-700 tracking-tighter" }, "CITA 11/02"),
                    ce('div', { className: "text-xs font-bold text-slate-600 uppercase tracking-widest mt-2 border-t border-slate-100 pt-2" }, "Estatus USK")
                )
            )
        );

        // --- DASHBOARD CONTAINER ---

        const Dashboard = () => {
            const [activeTab, setActiveTab] = useState('vision');
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            const tabs = [
                { id: 'vision', label: 'Cierres' },
                { id: 'financials', label: 'Control HH' },
                { id: 'portfolio', label: 'Portafolio' },
                { id: 'models', label: 'Modelos' },
                { id: 'strategy', label: 'Estrategia' },
                { id: 'agenda', label: 'Agenda' }
            ];

            return ce('div', { className: "min-h-screen flex flex-col font-sans" },
                ce('header', { className: "bg-slate-900 text-white sticky top-0 z-50 shadow-2xl ring-1 ring-white/10" },
                    ce('div', { className: "max-w-7xl mx-auto px-4 h-20 flex items-center justify-between" },
                        ce('div', { className: "flex items-center gap-4" },
                            ce('div', { className: "bg-white text-slate-900 font-black px-3 py-1 rounded-lg text-xl shadow-lg transform hover:scale-105 transition-transform cursor-default" }, "PH"),
                            ce('div', null,
                                ce('h1', { className: "font-bold tracking-tight text-lg leading-none" }, "MEOSA 2026"),
                                ce('p', { className: "text-[10px] text-slate-400 font-medium uppercase tracking-widest mt-0.5" }, "Centro de Mando")
                            )
                        ),
                        ce('nav', { className: "hidden md:flex bg-slate-800/50 p-1.5 rounded-xl border border-slate-700 backdrop-blur-sm" },
                            tabs.map(tab => 
                                ce('button', {
                                    key: tab.id,
                                    onClick: () => setActiveTab(tab.id),
                                    className: `px-5 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${activeTab === tab.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-slate-400 hover:text-white hover:bg-slate-700/50'}`
                                }, tab.label)
                            )
                        ),
                        ce('button', { className: "md:hidden p-2 text-slate-300 bg-slate-800 rounded-lg", onClick: () => setIsMenuOpen(!isMenuOpen) },
                            ce(isMenuOpen ? X : Menu, { size: 24 })
                        )
                    ),
                    isMenuOpen && ce('div', { className: "md:hidden bg-slate-800 border-t border-slate-700 p-2 absolute w-full shadow-xl z-50" },
                        tabs.map(tab => 
                            ce('button', {
                                key: tab.id,
                                onClick: () => { setActiveTab(tab.id); setIsMenuOpen(false); },
                                className: `block w-full text-left px-4 py-3 rounded-lg text-sm mb-1 ${activeTab === tab.id ? 'bg-blue-600 text-white' : 'text-slate-300'}`
                            }, tab.label)
                        )
                    )
                ),
                ce('main', { className: "flex-1 max-w-7xl w-full mx-auto px-4 py-10" },
                    activeTab === 'vision' && ViewVision(),
                    activeTab === 'financials' && ViewFinancials(),
                    activeTab === 'portfolio' && ViewPortfolio(),
                    activeTab === 'models' && ViewModels(),
                    activeTab === 'strategy' && ce('div', { className: "space-y-10 animate-enter" }, ViewStrategy(), ce(ViewAgenda)),
                    activeTab === 'agenda' && ViewAgenda() // Direct access too
                ),
                ce('footer', { className: "bg-white border-t border-slate-200 mt-auto py-8" },
                    ce('div', { className: "max-w-7xl mx-auto px-4 flex justify-between text-sm text-slate-500" },
                        ce('p', { className: "font-semibold text-slate-700" }, "PH | We´re Accountable"),
                        ce('div', { className: "flex items-center gap-2 text-xs font-mono bg-slate-100 px-3 py-1 rounded-full" },
                            ce('span', { className: "w-2 h-2 bg-emerald-500 rounded-full animate-pulse" }),
                            "J.A.R.V.I.S. SYSTEM ACTIVE"
                        )
                    )
                )
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(Dashboard));
    </script>
